name: Tests

# Branch pushes get the full suite — sources are fetched first, so the
# extractor regression tests run too (they skip without snapshots).
# main is covered by the test step in pages.yml.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch sources
        run: python3 download_sources.py --category implemented
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Run tests
        run: nix develop --command python -m unittest discover -s tests -v
