name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch sources
        run: python3 download_sources.py --category implemented
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Run tests
        run: nix develop --command python -m unittest discover -s tests
      - name: Build
        run: nix develop --command make
      - name: Run artifact QA
        run: nix develop --command make qa
      - name: Prepare flat site
        run: |
          mkdir -p _site/downloads
          cp CNAME .nojekyll _site/
          cp site/*.html site/favicon.ico _site/
          cp site/downloads/*.pdf site/downloads/*.epub _site/downloads/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
