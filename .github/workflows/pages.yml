name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore source snapshots
        uses: actions/cache@v4
        with:
          path: sources
          key: vatican-sources-${{ hashFiles('download_sources.py') }}
          restore-keys: |
            vatican-sources-
      - name: Fetch sources
        run: python3 download_sources.py --category implemented
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
      - name: Restore generated artefacts
        id: cache-artifacts
        uses: actions/cache@v4
        with:
          path: |
            build
            site/*.html
            site/downloads
          key: vatican-site-artifacts-v2-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'Makefile', 'core.py', 'parse.py', 'make_html.py', 'make_index.py', 'make_book.py', 'assets/**', 'templates/**', 'extract/**/*.py', 'sources/**') }}
      - name: Refresh cached artefact mtimes
        if: steps.cache-artifacts.outputs.cache-hit == 'true'
        run: |
          find build -type f -exec touch {} +
          find site -maxdepth 1 -name '*.html' -exec touch {} +
          find site/downloads -type f -exec touch {} +
      - name: Build
        run: nix develop --command make -j8
      - name: Prepare flat site
        run: |
          mkdir -p _site/downloads
          cp CNAME .nojekyll _site/
          cp site/*.html site/favicon.ico _site/
          cp site/downloads/*.pdf site/downloads/*.epub _site/downloads/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
